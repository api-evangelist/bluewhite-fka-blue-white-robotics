name: Bluewhite (fka Blue White Robotics)
description: >-
  Bluewhite (formerly Blue White Robotics) is an autonomy company that builds an
  AI-powered "Field Intelligence" physical-AI engine for operating vehicles in
  demanding, unstructured, real-world environments. Founded in Israel, the company
  first commercialized autonomous agriculture — retrofitting existing tractor fleets
  with an aftermarket autonomy kit for driverless spraying, mowing, and other field
  operations — and has since extended the same edge-processing autonomy stack to
  defense and security missions through OEM integrations and complete unmanned ground
  vehicles (UGVs). Bluewhite is a portfolio company of Insight Partners. The company
  exposes no public developer API, developer portal, or technical documentation; this
  API Evangelist profile tracks its identity and public web surface.
